/* ===== Flero-inspired theme: floating mega-menu nav, dark hero, bento cards, pill controls ===== */
:root{--d:#041a38;--ln:#e6eaf0}

h1{font-size:clamp(30px,3.6vw,44px);line-height:1.08;letter-spacing:-.01em}

.btn.r{background:var(--r)}.btn.r:hover{background:#a80001}.btn.w{background:#fff;color:var(--b)}.btn.w:hover{background:#e9eff8}
.pill{border-radius:999px;padding:3px 11px}
.card{border-radius:20px;border:1px solid var(--ln);box-shadow:0 1px 2px #0b1b3a0a,0 12px 30px -18px #0b1b3a30}
.grid .card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-3px);box-shadow:0 18px 36px -16px #0b1b3a44}
.k{position:relative;overflow:hidden}.k small{font-weight:600}.k b{font-size:38px;margin:2px 0}.k svg{position:absolute;right:16px;bottom:16px;width:80px;height:24px;opacity:.55}

.pgh{margin:18px 0 26px}
.eb{display:inline-block;background:#e4ebf4;color:var(--b);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px}.eb.w{background:#ffffff1f;color:#fff}

.top{display:block;position:sticky;top:12px;margin:12px 16px 0;padding:0;border:1px solid var(--ln);border-radius:22px;background:#ffffffe6;backdrop-filter:blur(14px);box-shadow:0 8px 30px -12px #07264E33;z-index:50}

.mm{display:none;position:absolute;top:calc(100% + 14px);left:-8px;width:min(660px,92vw);background:#fff;border:1px solid var(--ln);border-radius:22px;box-shadow:0 24px 60px -20px #07264E66;padding:12px;grid-template-columns:1.3fr 1fr;gap:12px;animation:up .2s both}

/* hero + workflow nodes */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;background:radial-gradient(600px 300px at 92% 0,#cc00013a,transparent 70%),linear-gradient(135deg,#041a38,#07264E 60%,#0d3a75);color:#d6e0ee;border-radius:28px;padding:44px;margin-bottom:20px;overflow:hidden}

.nd:nth-child(2){animation-delay:.12s}.nd:nth-child(3){animation-delay:.24s}.nd:nth-child(4){animation-delay:.36s}.nd:nth-child(5){animation-delay:.48s}
